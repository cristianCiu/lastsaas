app = 'lastsaas'
primary_region = 'iad'

[build]

[processes]
  app = "./lastsaas"
  worker = "./forecast-worker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ["app"]

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ["worker"]

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "15s"
    timeout = "5s"
    path = "/health"
